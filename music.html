<!DOCTYPE html>
<html lang="en">
<head>

<body>

<h1>music</h1>

  <a href="notes">notes</a>

</nav>

<hr>

<div class="now-playing">
  
  <div id="dynamic-album" data-album-id="1440885112">
    <span style="color: #555555; font-size: 14px;">loading album...</span>
  </div>
  
  <span class="caption">listenin</span>
</div>

<a href="https://music.youtube.com/playlist?list=OLAK5uy_nA_FZrkLYWSgody_98wN-K42OaR2xmVcU" target="_blank" class="easter-egg">click me!</a>
<footer>
hugeasiankid.com
</footer>

<script>
  // --- THE FOOLPROOF ROBOT (Searches by exact ID) ---
  const albumContainer = document.getElementById("dynamic-album");
  const albumId = albumContainer.getAttribute("data-album-id").trim(); // Cleans up accidental spaces

  // Set to search the US store so Songlink can properly find Spotify/YouTube apps
  fetch(`https://itunes.apple.com/lookup?id=${albumId}&entity=album&country=us`)
    .then(response => response.json())
    .then(data => {
      if (data.results.length > 0) {
        const album = data.results[0];
        
        // Upgrades the tiny image to a crystal-clear 1000x1000 resolution
        const highResCover = album.artworkUrl100.replace('100x100bb', '1000x1000bb');
        
        // Universal link setup
        const cleanAppleUrl = album.collectionViewUrl.split('?')[0];
        const musicLink = `https://song.link/${cleanAppleUrl}`;

        albumContainer.innerHTML = `
          <a href="${musicLink}" target="_blank">
            <img src="${highResCover}" alt="album cover">
          </a>
        `;
      } else {
        albumContainer.innerHTML = `<span style="color: #ff5555;">album not found! check the ID number.</span>`;
      }
    });

  // --- DESKTOP: Listen for the 'T' key for Terminal Mode ---
  document.addEventListener("keydown", function(event) {
    if (event.key === "t" || event.key === "T") {
      document.body.classList.toggle("terminal-mode");
    }
  });

  // --- MOBILE: Listen for 3 rapid taps for Terminal Mode ---
  let tapCount = 0;
  let tapTimer;

  document.addEventListener("touchstart", function() {
    tapCount++; 
    clearTimeout(tapTimer); 

    if (tapCount === 3) {
      document.body.classList.toggle("terminal-mode");
      tapCount = 0; 
    }

    tapTimer = setTimeout(function() {
      tapCount = 0;
    }, 500);
  });
</script>
</body>
</html>
